<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Query -->
  <rect x="20" y="110" width="130" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="85" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#312e81" font-weight="600">User Query</text>

  <line x1="150" y1="145" x2="220" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Vector search -->
  <rect x="225" y="100" width="150" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#14532d" font-weight="600">Vector Search</text>
  <text x="300" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#14532d">(embeddings DB)</text>

  <line x1="375" y1="145" x2="440" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="407" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">context</text>

  <!-- Prompt assembly -->
  <rect x="445" y="100" width="150" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="520" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#713f12" font-weight="600">Query + Context</text>
  <text x="520" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#713f12">→ Prompt</text>

  <line x1="595" y1="145" x2="655" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- LLM -->
  <rect x="660" y="100" width="120" height="90" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="720" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0c4a6e" font-weight="600">LLM</text>

  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">
    The model answers using facts it was never trained on, fetched fresh at request time.
  </text>
</svg>
