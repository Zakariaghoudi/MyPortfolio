<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="260" fill="#ffffff"/>

  <!-- Your App -->
  <rect x="20" y="90" width="150" height="80" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="95" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#312e81" font-weight="600">Your App</text>

  <line x1="170" y1="130" x2="255" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="212" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">request</text>

  <!-- LLM API -->
  <rect x="260" y="80" width="160" height="100" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="340" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0c4a6e" font-weight="600">LLM API</text>
  <text x="340" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0c4a6e">(untrusted text out)</text>

  <line x1="420" y1="130" x2="505" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="462" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">raw text</text>

  <!-- Validate -->
  <rect x="510" y="80" width="150" height="100" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="585" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#713f12" font-weight="600">Validate</text>
  <text x="585" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#713f12" font-weight="600">&amp; Parse</text>

  <line x1="660" y1="130" x2="720" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Render -->
  <rect x="640" y="200" width="0" height="0"/>
  <text x="725" y="135" font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="600">Show</text>
  <text x="725" y="152" font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="600">User</text>

  <text x="400" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">
    Never skip the validate step — treat the model's output like any other untrusted input.
  </text>
</svg>
