<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" rx="16"/>

  <!-- code bracket -->
  <text x="80" y="255" font-family="Menlo, monospace" font-size="140" fill="#1e293b" opacity="0.85">&lt;/&gt;</text>

  <!-- neural net nodes -->
  <g stroke="#94a3b8" stroke-width="2" opacity="0.6">
    <line x1="470" y1="140" x2="560" y2="110"/>
    <line x1="470" y1="140" x2="560" y2="190"/>
    <line x1="470" y1="140" x2="560" y2="270"/>
    <line x1="470" y1="220" x2="560" y2="110"/>
    <line x1="470" y1="220" x2="560" y2="190"/>
    <line x1="470" y1="220" x2="560" y2="270"/>
    <line x1="470" y1="300" x2="560" y2="190"/>
    <line x1="470" y1="300" x2="560" y2="270"/>
    <line x1="560" y1="110" x2="660" y2="200"/>
    <line x1="560" y1="190" x2="660" y2="200"/>
    <line x1="560" y1="270" x2="660" y2="200"/>
  </g>
  <circle cx="470" cy="140" r="10" fill="url(#node)"/>
  <circle cx="470" cy="220" r="10" fill="url(#node)"/>
  <circle cx="470" cy="300" r="10" fill="url(#node)"/>
  <circle cx="560" cy="110" r="8" fill="url(#node)"/>
  <circle cx="560" cy="190" r="8" fill="url(#node)"/>
  <circle cx="560" cy="270" r="8" fill="url(#node)"/>
  <circle cx="660" cy="200" r="14" fill="url(#node)"/>

  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155" font-weight="600">
    Web Development × Artificial Intelligence
  </text>
</svg>
